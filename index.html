<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovaTopUp $18</title><script src="https://sdk.mercadopago.com/js/v2"></script><style>body{font-family:Arial;background:#0f0f1a;color:#fff;padding:20px}.card{max-width:420px;margin:auto;background:#1a1a2e;padding:20px;border-radius:16px}input,select{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none}button{background:#00d9ff;padding:14px;width:100%;border:none;border-radius:10px;font-weight:bold;font-size:18px;cursor:pointer}#msg{color:#ff6b6b;white-space:pre-wrap;word-break:break-word;margin-top:10px;text-align:center}</style></head><body><div class="card"><h2 style="text-align:center;color:#00d9ff">💎 NovaTopUp MTY</h2><p id="price" style="text-align:center;color:#00ff88;font-size:24px">$18 - 110 Diamantes</p><input id="playerId" placeholder="ID: 1381809301"><select id="pack"><option value="110|18">110 - $18</option><option value="341|55">341 - $55</option><option value="572|87">572 - $87</option><option value="1166|180">1166 - $180</option><option value="2398|337">2398 - $337</option><option value="6160|792">6160 - $792</option></select><button id="btn">Continuar al pago</button><div id="brick"></div><p id="msg"></p></div><script>
const PUBLIC_KEY='APP_USR-47884e6a-fa70-4519-9430-f6103020f649';
const mp = new MercadoPago(PUBLIC_KEY, {locale:'es-MX'});
let amount=18, diamonds=110;
const sel=document.getElementById('pack'), priceEl=document.getElementById('price'), btn=document.getElementById('btn'), msg=document.getElementById('msg');
sel.addEventListener('change',()=>{const [d,a]=sel.value.split('|');diamonds=d;amount=Number(a);priceEl.textContent=`$${a} - ${d} Diamantes`});
btn.addEventListener('click', async()=>{
  const playerId=document.getElementById('playerId').value.trim();
  if(!playerId){msg.textContent='Pon tu ID';return;}
  msg.textContent='Cargando pago...'; btn.style.display='none';
  const bricksBuilder = mp.bricks();
  const renderPaymentBrick = async()=>{
    const settings={initialization:{amount:amount},callbacks:{
      onReady:()=>{msg.textContent='';},
      onSubmit:({selectedPaymentMethod,formData})=>{
        return new Promise((resolve,reject)=>{
          fetch('/api/process-payment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
            token:formData.token, payment_method_id:formData.payment_method_id, payer:{email:formData.payer.email}, amount:amount, playerId:playerId, diamonds:diamonds
          })}).then(r=>r.json()).then(data=>{
            if(data.status==='approved' || data.status==='pending'){msg.style.color='#00ff88';msg.textContent='¡Pago exitoso! ID:'+data.id+' Te enviaremos los diamantes.'; document.getElementById('brick').innerHTML=''; resolve();}
            else{msg.textContent='Error: '+JSON.stringify(data); reject();}
          }).catch(e=>{msg.textContent='Error: '+e; reject();});
        });
      }, onError:(e)=>{msg.textContent=JSON.stringify(e);}
    }};
    const controller = await bricksBuilder.create('payment','brick',settings);
  };
  renderPaymentBrick();
});
</script></body></html>
